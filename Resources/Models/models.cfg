# Custom models for the shop. One line per model you want to replace:
#
#   <Model Name> = <file in this folder> [scale=<to metres>] [rotate=x,y,z] [offset=x,y,z] [texture=<image>]
#
# - Model Name is exactly one of the names listed in README.md (e.g. "Crankshaft", "Machine: Boring Bar").
# - .obj and .fbx are supported. FBX files are converted to Y-up, metres before your options apply.
# - scale converts the file's units to metres: 0.001 for millimetres, 0.0254 for inches, 0.01 for centimetres.
# - rotate is in degrees about X, Y, Z; offset is in metres, applied after scale and rotation.
# - texture is an image (png/jpg) in this folder used instead of the built-in material.
# - If a file is missing or fails to load, the built-in model is used and a warning is printed.
#
# Examples (remove the leading # to use one):
#
# Crankshaft = lv20_crank.fbx
# Piston = piston.obj scale=0.001 texture=piston_albedo.png
# Engine Stand = engine_stand.obj scale=0.0254 rotate=0,90,0 offset=0,0,0
