# Custom sounds for the game. Like models.cfg: one line per sound you want to replace.
#
#   <Sound Name> = <file in this folder> [volume=1.0]
#
# - Files are .wav: uncompressed PCM (8, 16, 24 or 32 bit) or 32-bit float, mono or stereo, any sample rate.
#   Stereo is mixed down to mono (the game places sounds in the world itself).
# - Give a sound several lines and each file is one take of it, picked at random each time it plays.
# - If a file is missing or can't be read, the built-in sound is used and a warning is printed.
#
# One-shot sounds:
#   Footstep Concrete, Footstep Grass, Footstep Wood, Land, Pick Up, Set Down, Drop, Fit Part, Ratchet, Wrench,
#   Breaker Bar, Torque Click, Socket Clink, Impact, Cordless Ratchet, Measure, Crate Open, Cash, Machine, Click,
#   Page Turn, Starter, Bird, Exhaust Bang
# Loops (played over and over; make them loop cleanly):
#   Engine (the dyno's and the car's: record it at about 2400 rpm, it's pitched up and down from there),
#   Door, Lift, Wind, Hum
#
# Examples (remove the leading # to use one):
#
# Engine = my_engine_2400rpm.wav volume=0.8
# Starter = starter.wav
# Ratchet = ratchet_1.wav
# Ratchet = ratchet_2.wav
